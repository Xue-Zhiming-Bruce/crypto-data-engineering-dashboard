version: 2

models:
  - name: latest_price_per_symbol
    description: Most recent Kraken ticker event for each symbol.
    columns:
      - name: symbol
        tests:
          - unique
          - not_null
      - name: event_timestamp
        tests:
          - not_null

  - name: price_history
    description: Event-level price history used for the dashboard line chart.
    columns:
      - name: symbol
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null

  - name: hourly_price_summary
    description: Hourly ticker summary by symbol.
    columns:
      - name: symbol
        tests:
          - not_null
      - name: event_hour
        tests:
          - not_null

  - name: message_count_per_symbol
    description: Record count by symbol used for the categorical dashboard chart.
    columns:
      - name: symbol
        tests:
          - unique
          - not_null
